
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service History | TMW</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080d18;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #111a2b;
            border: 1px solid #263650;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 27px;
            letter-spacing: 1px;
            color: #60a5fa;
        }

        .brand p {
            color: #94a3b8;
            font-size: 12px;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-size: 13px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #080f1e;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
            color: #fca5a5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #60a5fa;
            text-decoration: none;
            font-size: 13px;
        }

        .note {
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>TUSHAR MOTOR WORKS</h1>
        <p>YOUR RIDE. OUR RESPONSIBILITY.</p>
    </div>

    <h2>Customer Service History</h2>

    <p class="subtitle">
        Enter your registered vehicle and customer details
        to search for your service records.
    </p>

    <form id="searchForm">

        <label for="vehicleNumber">Vehicle Registration Number</label>
        <input
            type="text"
            id="vehicleNumber"
            placeholder="Example: TN 12 BK 0812"
            required
        >

        <label for="fullName">Customer Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your registered full name"
            required
        >

        <label for="email">Registered Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            required
        >

        <button type="submit" id="searchButton">
            Search My Service Records
        </button>

    </form>

    <div id="message" class="message"></div>

    <p class="note">
        Please enter the same details registered with
        TUSHAR MOTOR WORKS.
    </p>

    <a href="/" class="back">← Back to Home</a>

</div>

<script>
    document.getElementById("searchForm").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const vehicleNumber =
                document.getElementById("vehicleNumber").value.trim();

            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const button =
                document.getElementById("searchButton");

            const message =
                document.getElementById("message");

            button.disabled = true;
            button.textContent = "Searching...";
            message.textContent = "";

            try {

                const response = await fetch(
                    "/api/customer-history/search",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            vehicleNumber,
                            fullName,
                            email
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "No matching records found."
                    );
                }

                sessionStorage.setItem(
                    "tmwCustomerHistory",
                    JSON.stringify(data)
                );

                window.location.href = "/customer-history.html";

            } catch (error) {

                message.textContent = error.message;

            } finally {

                button.disabled = false;
                button.textContent = "Search My Service Records";
            }
        }
    );
</script>

</body>
</html>
