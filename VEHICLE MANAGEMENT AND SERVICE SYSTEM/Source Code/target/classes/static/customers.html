
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer | Vehicle Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 7px 0 0;
            color: #cbd5e1;
        }

        main {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px #0f172a12;
        }

        h2 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .secondary {
            background: #e2e8f0;
            color: #1e293b;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-size: 15px;
        }

        #message {
            margin-top: 18px;
            font-weight: bold;
        }

        @media (max-width: 550px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Vehicle Management System</h1>
        <p>Customer Management / Add Customer</p>
    </header>

    <main>
        <section class="card">
            <h2>Register New Customer</h2>
            <p class="subtitle">
                Enter customer details to save them to the database.
            </p>

            <form id="customerForm">
                <div class="form-grid">
                    <div class="field full">
                        <label for="fullName">Full Name *</label>
                        <input id="fullName" name="fullName"
                               type="text" maxlength="100"
                               placeholder="Enter full name" required>
                    </div>

                    <div class="field">
                        <label for="phone">Phone Number *</label>
                        <input id="phone" name="phone"
                               type="tel" maxlength="15"
                               placeholder="Enter phone number" required>
                    </div>

                    <div class="field">
                        <label for="email">Email Address</label>
                        <input id="email" name="email"
                               type="email" maxlength="100"
                               placeholder="name@example.com">
                    </div>

                    <div class="field full">
                        <label for="address">Address</label>
                        <textarea id="address" name="address"
                                  maxlength="255"
                                  placeholder="Enter customer address"></textarea>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit">Save Customer</button>
                    <a class="secondary" href="index.html">Dashboard</a>
                </div>

                <p id="message" role="status"></p>
            </form>
        </section>
    </main>

    <script>
        document.getElementById("customerForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const customer = {
                    fullName: document.getElementById("fullName").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    address: document.getElementById("address").value.trim()
                };

                const message = document.getElementById("message");

                if (!customer.fullName || !customer.phone) {
                    message.textContent = "Please enter the name and phone number.";
                    message.style.color = "#dc2626";
                    return;
                }

                try {
                    const response = await fetch("/api/customers", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(customer)
                    });

                    const result = await response.text();

                    if (response.ok) {
                        message.textContent = result;
                        message.style.color = "#15803d";
                        document.getElementById("customerForm").reset();
                    } else {
                        message.textContent = result;
                        message.style.color = "#dc2626";
                    }
                } catch (error) {
                    message.textContent =
                        "Cannot connect to the server. Check whether Spring Boot is running.";
                    message.style.color = "#dc2626";
                }
            });
    </script>
</body>
</html>
