
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Vehicle | Vehicle Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 24px 8%;
        }

        header p {
            color: #cbd5e1;
            margin-top: 8px;
        }

        main {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
        }

        h2 {
            margin-bottom: 25px;
        }

        h3 {
            margin: 25px 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            color: #dc2626;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .panel {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Vehicle Management System</h1>
    <p>Update vehicle and customer information</p>
</header>

<main>
    <section class="panel">

        <h2>Edit Vehicle</h2>

        <form id="editVehicleForm">

            <h3>Vehicle Details</h3>

            <div class="form-grid">

                <div>
                    <label for="registration">Registration Number</label>
                    <input type="text" id="registration" required>
                </div>

                <div>
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" required>
                </div>

                <div>
                    <label for="model">Model</label>
                    <input type="text" id="model" required>
                </div>

                <div>
                    <label for="year">Manufacturing Year</label>
                    <input type="number" id="year"
                           min="1886" max="2100" required>
                </div>

                <div class="full">
                    <label for="type">Vehicle Type</label>
                    <select id="type" required>
                        <option value="">Choose vehicle type</option>
                        <option value="Car">Car</option>
                        <option value="Bike">Bike</option>
                        <option value="Scooter">Scooter</option>
                        <option value="Van">Van</option>
                        <option value="Truck">Truck</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

            </div>

            <h3>Customer Details</h3>

            <div class="form-grid">

                <div>
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" required>
                </div>

                <div>
                    <label for="customerPhone">Contact Number</label>
                    <input type="tel" id="customerPhone"
                           maxlength="15" required>
                </div>

                <div class="full">
                    <label for="customerEmail">Email Address</label>
                    <input type="email" id="customerEmail">
                </div>

                <div class="full">
                    <label for="customerAddress">Address</label>
                    <input type="text" id="customerAddress">
                </div>

            </div>

            <button type="submit" id="saveButton">
                Save Changes
            </button>

            <p class="message" id="message" role="status"></p>

        </form>

        <a class="back" href="/">← Back to Dashboard</a>

    </section>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const vehicleId = params.get("id");

    const form = document.getElementById("editVehicleForm");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    // LOAD EXISTING VEHICLE AND CUSTOMER DETAILS
    async function loadVehicle() {

        if (!vehicleId || !/^\d+$/.test(vehicleId)) {
            message.textContent = "Invalid vehicle ID!";
            form.querySelectorAll("input, select, button")
                .forEach(element => element.disabled = true);
            return;
        }

        try {
            const response = await fetch("/api/vehicles");

            if (!response.ok) {
                throw new Error("Could not load vehicle records.");
            }

            const vehicles = await response.json();

            const vehicle = vehicles.find(
                v => String(v.id) === vehicleId
            );

            if (!vehicle) {
                message.textContent = "Vehicle not found!";
                form.querySelectorAll("input, select, button")
                    .forEach(element => element.disabled = true);
                return;
            }

            // VEHICLE DETAILS
            document.getElementById("registration").value =
                vehicle.registration_number || "";

            document.getElementById("brand").value =
                vehicle.brand || "";

            document.getElementById("model").value =
                vehicle.model || "";

            document.getElementById("year").value =
                vehicle.manufacturing_year || "";

            document.getElementById("type").value =
                vehicle.vehicle_type || "";

            // CUSTOMER DETAILS
            document.getElementById("customerName").value =
                vehicle.customer_name || "";

            document.getElementById("customerPhone").value =
                vehicle.customer_phone || "";

            document.getElementById("customerEmail").value =
                vehicle.customer_email || "";

            document.getElementById("customerAddress").value =
                vehicle.customer_address || "";

        } catch (error) {
            message.textContent = error.message;
        }
    }

    // SAVE UPDATED VEHICLE AND CUSTOMER DETAILS
    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.textContent = "";
        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        const updatedData = {
            registration: document.getElementById("registration").value.trim(),
            brand: document.getElementById("brand").value.trim(),
            model: document.getElementById("model").value.trim(),
            year: document.getElementById("year").value,
            type: document.getElementById("type").value,

            customerName: document.getElementById("customerName").value.trim(),
            customerPhone: document.getElementById("customerPhone").value.trim(),
            customerEmail: document.getElementById("customerEmail").value.trim(),
            customerAddress: document.getElementById("customerAddress").value.trim()
        };

        try {
            const response = await fetch(
                `/api/vehicles/${vehicleId}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(updatedData)
                }
            );

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "Unable to update details.");
            }

            alert("Vehicle and customer details updated successfully!");

            window.location.href = "/view-vehicles.html";

        } catch (error) {
            message.textContent = error.message;
        } finally {
            saveButton.disabled = false;
            saveButton.textContent = "Save Changes";
        }
    });

    loadVehicle();
</script>

</body>
</html>
