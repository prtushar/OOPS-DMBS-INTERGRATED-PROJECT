
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle | Vehicle Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 24px 8%;
        }

        header p {
            margin-top: 8px;
            color: #cbd5e1;
        }

        main {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
        }

        h2 {
            margin-bottom: 22px;
        }

        .section-heading {
            grid-column: 1 / -1;
            margin-top: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            color: #2563eb;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full, .section-heading {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🚘 Vehicle Management</h1>
    <p>Add a new vehicle and customer information.</p>
</header>

<main>
    <section class="panel">

        <h2>Add New Vehicle</h2>

        <form id="vehicleForm">

            <div class="form-grid">

                <h3 class="section-heading">Vehicle Details</h3>

                <div>
                    <label for="registration">Registration Number</label>
                    <input type="text" id="registration"
                           placeholder="e.g. TN 01 AB 1234" required>
                </div>

                <div>
                    <label for="brand">Brand</label>
                    <input type="text" id="brand"
                           placeholder="e.g. Toyota" required>
                </div>

                <div>
                    <label for="model">Model</label>
                    <input type="text" id="model"
                           placeholder="e.g. Glanza V" required>
                </div>

                <div>
                    <label for="year">Manufacturing Year</label>
                    <input type="number" id="year"
                           min="1886" max="2100"
                           placeholder="e.g. 2024" required>
                </div>

                <div class="full">
                    <label for="type">Vehicle Type</label>
                    <select id="type" required>
                        <option value="">Choose vehicle type</option>
                        <option value="Car">Car</option>
                        <option value="Bike">Bike</option>
                        <option value="Scooter">Scooter</option>
                    </select>
                </div>

                <h3 class="section-heading">Customer Details</h3>

                <div>
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" required>
                </div>

                <div>
                    <label for="customerPhone">Phone Number</label>
                    <input type="tel" id="customerPhone"
                           maxlength="15" required>
                </div>

                <div>
                    <label for="customerEmail">Email</label>
                    <input type="email" id="customerEmail">
                </div>

                <div>
                    <label for="customerAddress">Address</label>
                    <input type="text" id="customerAddress">
                </div>

            </div>

            <button type="submit" id="saveButton">
                Add Vehicle
            </button>

            <p id="message" role="status"></p>

        </form>

        <a class="back" href="/">← Back to Dashboard</a>

    </section>
</main>

<script>

    const form = document.getElementById("vehicleForm");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.textContent = "";
        message.className = "";

        const vehicle = {

            registration:
                document.getElementById("registration").value.trim(),

            brand:
                document.getElementById("brand").value.trim(),

            model:
                document.getElementById("model").value.trim(),

            year:
                document.getElementById("year").value,

            type:
                document.getElementById("type").value,

            customerName:
                document.getElementById("customerName").value.trim(),

            customerPhone:
                document.getElementById("customerPhone").value.trim(),

            customerEmail:
                document.getElementById("customerEmail").value.trim(),

            customerAddress:
                document.getElementById("customerAddress").value.trim()

        };

        const year = Number(vehicle.year);

        if (!Number.isInteger(year) || year < 1886 || year > 2100) {
            message.textContent = "Enter a valid manufacturing year.";
            message.className = "error";
            return;
        }

        if (!vehicle.customerName || !vehicle.customerPhone) {
            message.textContent =
                "Customer name and phone number are required.";
            message.className = "error";
            return;
        }

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {

            const response = await fetch("/api/vehicles", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(vehicle)
            });

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result);
            }

            message.textContent =
                "Vehicle and customer added successfully!";

            message.className = "success";

            form.reset();

        } catch (error) {

            message.textContent = error.message;
            message.className = "error";

        } finally {

            saveButton.disabled = false;
            saveButton.textContent = "Add Vehicle";

        }

    });

</script>

</body>
</html>
